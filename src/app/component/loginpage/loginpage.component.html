
  <div class="login-container">
    <h2>🚚 VivekTransportt <br> Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <div class="options">
      <a href="#" id="forgotPassword">Forgot Password?</a> | 
      <a href="#">Sign Up</a>
    </div>

    <div class="social-login">
      <button class="social-btn google">🔴 Login with Google</button>
      <button class="social-btn facebook">📘 Login with Facebook</button>
    </div>
  </div>

  <script>
    // Simple form handler
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Login submitted for: " + document.getElementById("email").value);
    });

    // Forgot password handler
    document.getElementById("forgotPassword").addEventListener("click", function(e) {
      e.preventDefault();
      alert("Redirecting to password recovery page...");
    });
  </script>
